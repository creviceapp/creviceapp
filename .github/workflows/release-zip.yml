name: Release ZIP

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional package version, such as 4.14.500.0 or v4.14.500.
        required: false
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release-zip:
    runs-on: windows-2022
    env:
      Configuration: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x86

      - name: Install legacy Windows SDK contracts
        shell: pwsh
        run: .\eng\Install-LegacyWindowsSdk.ps1

      - name: Resolve package version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) {
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $version = $env:GITHUB_REF_NAME
            } else {
              $version = "4.14.$env:GITHUB_RUN_NUMBER.0"
            }
          }
          .\eng\Set-Version.ps1 -Version $version

      - name: Check .NET Framework 4.6.2 targeting pack
        shell: pwsh
        run: |
          $targetingPack = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6.2"
          if (-not (Test-Path -LiteralPath $targetingPack)) {
            throw ".NET Framework 4.6.2 targeting pack was not found at $targetingPack."
          }

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore CreviceApp\packages.config -PackagesDirectory packages
          nuget restore CreviceAppTests\packages.config -PackagesDirectory packages
          nuget restore CreviceLibTests\packages.config -PackagesDirectory packages
          dotnet restore CreviceLib\CreviceLib.csproj

      - name: Build desktop app
        shell: cmd
        run: msbuild CreviceApp\CreviceApp.csproj /p:Configuration=%Configuration% /verbosity:minimal

      - name: Create unsigned ZIP
        shell: pwsh
        run: |
          $artifactDir = Join-Path $PWD 'artifacts\zip'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $zipPath = Join-Path $artifactDir "Crevice-$env:CREVICE_VERSION-win32-unsigned.zip"
          Compress-Archive -Path 'CreviceApp\bin\Release\*' -DestinationPath $zipPath -Force
          $hash = Get-FileHash -Path $zipPath -Algorithm SHA256
          "$($hash.Hash)  $(Split-Path -Leaf $zipPath)" | Set-Content -Path (Join-Path $artifactDir 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v7
        with:
          name: crevice-unsigned-zip-${{ env.CREVICE_VERSION }}
          path: artifacts/zip/**
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem -Path artifacts\zip\*
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @($assets.FullName) --clobber
          } else {
            gh release create $tag @($assets.FullName) --title $tag --notes "Crevice $tag"
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
